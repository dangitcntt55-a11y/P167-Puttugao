global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    static_configs:
      - targets: ["host.docker.internal:8000"]  # FastAPI /metrics

  - job_name: "celery"
    static_configs:
      - targets: ["host.docker.internal:9801"]  # Celery flower metrics
